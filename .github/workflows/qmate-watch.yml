name: Qmate Applicant Watch

# Qmate応募者を定期取得 → ランク自動判定 → Slack通知。
# Qmate APIはWebhook非対応のためポーリングする。
#  ・schedule          : GitHub内蔵cron(*/10)。ただしGitHub都合で実際は数時間おきに間引かれるためバックアップ用途。
#  ・workflow_dispatch : 手動 or 外部cron(例:cron-job.org)からの起動。dry_run=false で本番送信。
#                        外部cronはこれを約10分おきに呼び、ほぼ定刻でポーリングする。
#                        既定(dry_run=true)はDRY RUN（送信なし・動作確認）。
#  ・pull_request      : 動作確認用。常にDRY RUN（Slack送信なし）でログに判定結果を出す。
# schedule と 外部cron(本番) は状態(qmate_state.json)をcacheで共有し、重複通知を防ぐ。
on:
  schedule:
    - cron: "*/10 * * * *"   # 10分おき指定だがGitHub側で大幅に間引かれる。実質バックアップ。
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Slack送信せずログ出力のみ（動作確認）。false で本番送信。"
        type: boolean
        default: true
      export_date:
        description: "取得対象日 yyyy/mm/dd（空欄=今日 JST）"
        type: string
        default: ""
  pull_request:
    paths:
      - "qmate_watcher.py"
      - "rank.py"
      - ".github/workflows/qmate-watch.yml"

concurrency:
  # 本番ポーリング(schedule/外部cron)を直列化し、状態cacheの競合・二重通知を防ぐ。
  group: qmate-watch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      QMATE_API_KEY: ${{ secrets.QMATE_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # 備考などの自由記述から年齢/転職回数/短期離職数をAI抽出するために使用
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QMATE_STATE_FILE: qmate_state.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (備考からのAI抽出に使用)
        run: pip install --quiet google-genai

      - name: 実行モードを決定（schedule/外部cron=本番送信 / それ以外=DRY RUN）
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "schedule" ]; then
            echo "QMATE_DRY_RUN=" >> "$GITHUB_ENV"
            echo "QMATE_NOTIFY_ON_FIRST_RUN=" >> "$GITHUB_ENV"
            echo "QMATE_STATEFUL=1" >> "$GITHUB_ENV"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            # 外部cron等からの本番起動。scheduleと同じく初回はシード→以降は新規のみ通知。
            echo "QMATE_DRY_RUN=" >> "$GITHUB_ENV"
            echo "QMATE_NOTIFY_ON_FIRST_RUN=" >> "$GITHUB_ENV"
            echo "QMATE_STATEFUL=1" >> "$GITHUB_ENV"
          else
            echo "QMATE_DRY_RUN=1" >> "$GITHUB_ENV"         # PR/手動の既定: 送信なし
            echo "QMATE_NOTIFY_ON_FIRST_RUN=1" >> "$GITHUB_ENV"
            echo "QMATE_STATEFUL=" >> "$GITHUB_ENV"
          fi
          echo "QMATE_EXPORT_DATE=${{ inputs.export_date }}" >> "$GITHUB_ENV"

      # 通知済み状態を前回実行から引き継ぐ（重複通知防止）。本番(schedule/外部cron)で共有。
      - name: Restore notify state
        if: env.QMATE_STATEFUL == '1'
        uses: actions/cache/restore@v4
        with:
          path: qmate_state.json
          key: qmate-state-${{ github.run_id }}
          restore-keys: |
            qmate-state-

      - name: Run watcher
        run: python qmate_watcher.py

      - name: Save notify state
        if: env.QMATE_STATEFUL == '1'
        uses: actions/cache/save@v4
        with:
          path: qmate_state.json
          key: qmate-state-${{ github.run_id }}
