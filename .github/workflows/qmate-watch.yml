name: Qmate Applicant Watch

# Qmate応募者を定期取得 → ランク自動判定 → Slack通知。
# Qmate APIはWebhook非対応のため、scheduleでポーリングする。
# ※ scheduleはデフォルトブランチ(main)にマージ後に有効化される。
#   PRブランチでは手動(workflow_dispatch)も含め起動しない点に注意。

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分おき（UTC基準・GitHub側都合で多少遅延あり）
  workflow_dispatch: {}        # 手動実行も可能

concurrency:
  group: qmate-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      QMATE_API_KEY: ${{ secrets.QMATE_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      QMATE_STATE_FILE: qmate_state.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 通知済み状態を前回の実行から引き継ぐ（重複通知の防止）。
      # mutable cache パターン: run_idで保存し、prefixで直近を復元する。
      - name: Restore notify state
        uses: actions/cache/restore@v4
        with:
          path: qmate_state.json
          key: qmate-state-${{ github.run_id }}
          restore-keys: |
            qmate-state-

      - name: Run watcher
        run: python qmate_watcher.py

      - name: Save notify state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: qmate_state.json
          key: qmate-state-${{ github.run_id }}
